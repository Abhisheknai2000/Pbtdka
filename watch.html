<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Watch</title>
<link rel="stylesheet" href="style.css">

<style>
.player-container {
  width: 100%;
  max-width: 900px;
  margin: auto;
}
video {
  width: 100%;
  height: 500px;
  background: black;
}
</style>
</head>

<body>

<div class="container">
  <h2 id="title"></h2>
  <div class="player-container">
    <video id="player" controls autoplay playsinline></video>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);

const videoSrc = decodeURIComponent(params.get("video") || "");
const title = decodeURIComponent(params.get("title") || "");

document.getElementById("title").innerText = title;

const video = document.getElementById("player");

// 🔥 TRY FORCE PLAY
video.src = videoSrc;

// ❌ Agar fail ho → open external
video.onerror = () => {
  alert("Player me nahi chal raha, external open ho raha hai");

  window.open(videoSrc, "_blank");
};
</script>

</body>
</html>
