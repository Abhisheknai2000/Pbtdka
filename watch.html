<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Watch Player</title> 
<style> 
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background-color: #000; font-family: sans-serif; color: white; overflow: hidden; width: 100vw; height: 100vh; }
  
  /* Main Container */
  .player-container { 
    position: relative; width: 100vw; height: 100vh; background: black; 
    display: flex; justify-content: center; align-items: center; 
  }
  
  /* Video Tag - Scale handling */
  video { 
    width: 100%; height: 100%; object-fit: contain; /* Default Best Fit */
    transition: object-fit 0.2s ease;
  }
  
  /* Full Custom Overlay Controls */
  .controls-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.4); display: flex; flex-direction: column;
    justify-content: space-between; z-index: 10; opacity: 1; transition: opacity 0.4s;
  }
  .controls-overlay.hide { opacity: 0; pointer-events: none; }

  /* Top Bar Controls */
  .top-bar { padding: 15px; display: flex; align-items: center; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
  .back-btn { background: transparent; border: none; color: white; font-size: 24px; cursor: pointer; margin-right: 15px; }
  .movie-title { font-size: 18px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; }

  /* Center Controls (Play/Pause, Rewind, Forward) */
  .center-controls { display: flex; justify-content: center; align-items: center; gap: 40px; }
  .control-btn { background: rgba(255, 255, 255, 0.1); border: none; color: white; border-radius: 50%; width: 60px; height: 60px; font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
  .control-btn:hover, .control-btn:focus { background: #00ffe1; color: black; outline: none; transform: scale(1.1); }
  .main-play-btn { width: 80px; height: 80px; font-size: 30px; }

  /* Bottom Bar Controls */
  .bottom-bar { padding: 15px; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); display: flex; flex-direction: column; gap: 10px; }
  .progress-container { display: flex; align-items: center; gap: 10px; width: 100%; }
  .time-display { font-size: 14px; min-width: 50px; }
  .progress-bar { flex-grow: 1; height: 50px; display: flex; align-items: center; cursor: pointer; }
  .progress-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.3); border-radius: 3px; position: relative; }
  .progress-fill { height: 100%; width: 0%; background: #00ffe1; border-radius: 3px; position: absolute; left: 0; top: 0; }

  /* Action Row (Bottom Buttons) */
  .action-row { display: flex; justify-content: flex-end; align-items: center; gap: 20px; }
  .action-btn { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
  .action-btn:hover, .action-btn:focus { background: white; color: black; outline: none; }

  /* Side Buttons (Lock / Volume) */
  .side-controls { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 15px; z-index: 12; }
  .lock-btn { background: rgba(0,0,0,0.6); border: 1px solid #fff; color: white; border-radius: 50%; width: 50px; height: 50px; font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
  .lock-btn.locked { border-color: #ff4757; color: #ff4757; }

  /* Locked overlay screen state */
  .locked-state-overlay { position: absolute; top:0; left:0; width:100%; height:100%; z-index: 15; display: none; }
</style> 
</head>  
<body>  

<div class="player-container" id="player-container">
  
  <video id="player" autoplay playsinline webkit-playsinline x5-playsinline></video>   

  <div class="side-controls" id="side-controls">
    <button class="lock-btn" id="lock-btn" title="Lock Screen">🔓</button>
  </div>
  
  <div class="locked-state-overlay" id="locked-overlay"></div>

  <div class="controls-overlay" id="controls-menu">
    
    <div class="top-bar">
      <button class="back-btn" id="back-button" onclick="goBack()">←</button>
      <div class="movie-title" id="title">Loading Movie...</div>
    </div>

    <div class="center-controls">
      <button class="control-btn" id="rewind-btn" title="Rewind 10s">⏪ 10s</button>
      <button class="control-btn main-play-btn" id="play-pause-btn" title="Play/Pause">⏸</button>
      <button class="control-btn" id="forward-btn" title="Forward 10s">10s ⏩</button>
    </div>

    <div class="bottom-bar">
      <div class="progress-container">
        <span class="time-display" id="current-time">00:00</span>
        <div class="progress-bar" id="progress-bar">
          <div class="progress-bg">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
        <span class="time-display" id="total-duration">00:00</span>
      </div>

      <div class="action-row">
        <button class="action-btn" id="vol-down-btn">Vol -</button>
        <button class="action-btn" id="vol-up-btn">Vol +</button>
        <button class="action-btn" id="scale-btn">Ratio: Best Fit</button>
      </div>
    </div>

  </div>
</div>  

<script> 
const params = new URLSearchParams(window.location.search);  
const videoSrc = decodeURIComponent(params.get("video") || ""); 
const titleStr = decodeURIComponent(params.get("title") || "Movie");  

document.getElementById("title").innerText = titleStr;  
const video = document.getElementById("player");  
video.src = videoSrc;  

const storageKey = `resume_time_${btoa(titleStr)}`; 

// Custom UI Element Hooks
const controlsMenu = document.getElementById("controls-menu");
const playPauseBtn = document.getElementById("play-pause-btn");
const rewindBtn = document.getElementById("rewind-btn");
const forwardBtn = document.getElementById("forward-btn");
const progressFill = document.getElementById("progress-fill");
const progressBar = document.getElementById("progress-bar");
const currentTimeDisplay = document.getElementById("current-time");
const totalDurationDisplay = document.getElementById("total-duration");
const scaleBtn = document.getElementById("scale-btn");
const lockBtn = document.getElementById("lock-btn");
const lockedOverlay = document.getElementById("locked-overlay");
const volUpBtn = document.getElementById("vol-up-btn");
const volDownBtn = document.getElementById("vol-down-btn");

let hideControlsTimeout;
let isLocked = false;
// Aspect ratio cycle array
const aspectModes = ["contain", "cover", "fill"];
const aspectLabels = ["Best Fit", "Zoom/Fit Screen", "Stretch Full"];
let currentAspectIdx = 0;

// 1. CONTINUE WATCHING LOAD
video.addEventListener('loadedmetadata', () => {
  const savedTime = localStorage.getItem(storageKey);
  if (savedTime) { video.currentTime = parseFloat(savedTime); }
  totalDurationDisplay.innerText = formatTime(video.duration);
});

// 2. TIME PROGRESS TRACKING & AUTO SAVE
video.addEventListener('timeupdate', () => {
  // Update time bar percentage
  const pct = (video.currentTime / video.duration) * 100;
  progressFill.style.width = `${pct}%`;
  currentTimeDisplay.innerText = formatTime(video.currentTime);

  // Storage updates
  if (video.currentTime / video.duration > 0.95) {
    localStorage.removeItem(storageKey);
  } else {
    localStorage.setItem(storageKey, video.currentTime);
  }
});

// Play/Pause Action
function togglePlay() {
  if (video.paused) {
    video.play();
    playPauseBtn.innerText = "⏸";
  } else {
    video.pause();
    playPauseBtn.innerText = "▶";
  }
  resetControlsTimeout();
}
playPauseBtn.onclick = togglePlay;

// 10s Forward / Backward Operations
rewindBtn.onclick = () => { video.currentTime = Math.max(0, video.currentTime - 10); resetControlsTimeout(); };
forwardBtn.onclick = () => { video.currentTime = Math.min(video.duration, video.currentTime + 10); resetControlsTimeout(); };

// Timeline Scrubbing seeking handler
progressBar.onclick = (e) => {
  const rect = progressBar.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const width = rect.width;
  video.currentTime = (clickX / width) * video.duration;
  resetControlsTimeout();
};

// Volume Adjustment Buttons (TV Support Native Alternative Interface)
volUpBtn.onclick = () => { video.volume = Math.min(1, video.volume + 0.1); resetControlsTimeout(); };
volDownBtn.onclick = () => { video.volume = Math.max(0, video.volume - 0.1); resetControlsTimeout(); };

// 🔥 ASPECT RATIO SWITCHING LOGIC (Fit to screen fix for TVs/Mobiles)
scaleBtn.onclick = () => {
  currentAspectIdx = (currentAspectIdx + 1) % aspectModes.length;
  video.style.objectFit = aspectModes[currentAspectIdx];
  scaleBtn.innerText = `Ratio: ${aspectLabels[currentAspectIdx]}`;
  resetControlsTimeout();
};

// LOCK CONTROLS LOGIC
lockBtn.onclick = () => {
  isLocked = !isLocked;
  if(isLocked) {
    lockBtn.innerText = "🔒";
    lockBtn.classList.add("locked");
    controlsMenu.classList.add("hide");
    lockedOverlay.style.display = "block";
  } else {
    lockBtn.innerText = "🔓";
    lockBtn.classList.remove("locked");
    controlsMenu.classList.remove("hide");
    lockedOverlay.style.display = "none";
    resetControlsTimeout();
  }
};
lockedOverlay.onclick = () => {
  // Show lock button briefly when clicking an interface that is locked down
  lockBtn.style.transform = "scale(1.3)";
  setTimeout(() => lockBtn.style.transform = "scale(1)", 300);
};

// Custom Helpers for Visibility UI Control Timeout
function showControls() {
  if (isLocked) return;
  controlsMenu.classList.remove("hide");
  resetControlsTimeout();
}

function resetControlsTimeout() {
  clearTimeout(hideControlsTimeout);
  if (!video.paused) {
    hideControlsTimeout = setTimeout(() => {
      if (!isLocked) controlsMenu.classList.add("hide");
    }, 4000); // 4 seconds idleness hides overlay controls layout
  }
}

document.getElementById("player-container").onclick = (e) => {
  if(e.target.id === "player-container" || e.target.id === "player") {
    if(controlsMenu.classList.contains("hide")) { showControls(); } 
    else { if(!video.paused) controlsMenu.classList.add("hide"); }
  }
};

// Formatter setup strings conversion
function formatTime(seconds) {
  if (isNaN(seconds)) return "00:00";
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);
  const pad = (num) => String(num).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

function goBack() {
  window.history.back();
}

// Global window event setup integration trigger for orientation setup
window.addEventListener('DOMContentLoaded', () => {
  if (screen.orientation?.lock) {
    screen.orientation.lock('landscape').catch(() => {});
  }
  resetControlsTimeout();
});

video.onerror = () => {   
  alert("Error loading this track format.");
  goBack();
}; 
</script>  
</body> 
</html>
