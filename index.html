<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movies</title>
<link rel="stylesheet" href="style.css">
<style>
  /* 🔍 Search Input and Container Styling */
  .search-container {
    position: relative;
    display: flex;
    align-items: center;
    max-width: 300px;
    width: 100%;
  }
  .search-box {
    width: 100%;
    padding: 8px 35px 8px 12px;
    border-radius: 20px;
    border: 1px solid #333;
    background: #222;
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: 0.3s;
  }
  .search-box:focus {
    border-color: #00ffe1;
    box-shadow: 0 0 8px rgba(0, 255, 225, 0.2);
  }
  .clear-btn {
    position: absolute;
    right: 12px;
    background: transparent;
    border: none;
    color: #888;
    cursor: pointer;
    font-size: 14px;
    display: none; /* Default me hidden rahega */
  }
  .clear-btn:hover {
    color: #fff;
  }
</style>
</head>

<body>

<div class="navbar">
  <div class="logo">Punjabi Movies</div>
  <div class="search-container">
    <input type="text" id="search-input" class="search-box" placeholder="Search movie...">
    <button id="clear-search" class="clear-btn">&#10006;</button>
  </div>
</div>

<div class="container">
  <div class="grid" id="movies"></div>
</div>

<script src="script.js"></script>
</body>
</html>
