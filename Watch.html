<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Watch</title>
<link rel="stylesheet" href="style.css">

<style>
.player-container {
  width: 100%;
  max-width: 900px;
  margin: auto;
}

video, iframe {
  width: 100%;
  height: 500px;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">
  <h2 id="title"></h2>

  <div class="player-container" id="playerBox"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);

const videoSrc = decodeURIComponent(params.get("video") || "");
const title = decodeURIComponent(params.get("title") || "");

document.getElementById("title").innerText = title;

const playerBox = document.getElementById("playerBox");

function createVideoPlayer(url) {
  const video = document.createElement("video");

  video.controls = true;
  video.autoplay = true;
  video.playsInline = true;

  // 🔥 important headers workaround
  video.setAttribute("crossorigin", "anonymous");

  video.src = url;

  playerBox.appendChild(video);

  // ❌ if fails → fallback iframe
  video.onerror = () => {
    playerBox.innerHTML = `
      <iframe src="${url}" allowfullscreen></iframe>
    `;
  };
}

// 🚀 LOAD PLAYER
if(videoSrc) {
  createVideoPlayer(videoSrc);
} else {
  playerBox.innerHTML = "<p>No video found</p>";
}
</script>

</body>
</html>
