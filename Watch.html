<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Watch</title>
<link rel="stylesheet" href="style.css">

<style>
.player-container {
  width: 100%;
  max-width: 900px;
  margin: auto;
}
video, iframe {
  width: 100%;
  height: 500px;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">
  <h2 id="title"></h2>
  <div class="player-container" id="playerBox"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);

const videoSrc = decodeURIComponent(params.get("video") || "");
const title = decodeURIComponent(params.get("title") || "");

document.getElementById("title").innerText = title;

const playerBox = document.getElementById("playerBox");

// 🎬 PLAYER LOGIC
if(videoSrc.includes(".mp4") || videoSrc.includes(".webm")) {
  playerBox.innerHTML = `
    <video src="${videoSrc}" controls autoplay></video>
  `;
} else {
  playerBox.innerHTML = `
    <iframe src="${videoSrc}" allowfullscreen></iframe>
  `;
}
</script>

</body>
</html>
