<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Watch</title>
<link rel="stylesheet" href="../style.css">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
.player-container {
  width: 100%;
  max-width: 900px;
  margin: auto;
}
iframe, video {
  width: 100%;
  height: 500px;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">
  <h2 id="title"></h2>

  <div class="player-container" id="playerBox">
    <!-- Player auto load hoga -->
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);

const videoSrc = decodeURIComponent(params.get("video") || "");
const title = decodeURIComponent(params.get("title") || "");

document.getElementById("title").innerText = title;

const playerBox = document.getElementById("playerBox");

// 🔥 FUNCTION: Detect player type
function loadPlayer(url) {

  // 👉 M3U8 (HLS)
  if (url.includes(".m3u8")) {
    const video = document.createElement("video");
    video.controls = true;

    playerBox.appendChild(video);

    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
    } else {
      video.src = url;
    }
  }

  // 👉 MP4 / Direct video
  else if (url.match(/\.(mp4|webm|ogg)$/)) {
    const video = document.createElement("video");
    video.src = url;
    video.controls = true;
    playerBox.appendChild(video);
  }

  // 👉 EMBED / iframe links
  else {
    const iframe = document.createElement("iframe");
    iframe.src = url;
    iframe.allowFullscreen = true;
    playerBox.appendChild(iframe);
  }
}

// 🚀 LOAD PLAYER
if(videoSrc) {
  loadPlayer(videoSrc);
} else {
  playerBox.innerHTML = "<p>No video found</p>";
}
</script>

</body>
</html>
